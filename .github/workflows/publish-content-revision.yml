name: Publish content revision

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "static/**"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Refresh timestamps for changed documents
        env:
          BASE_COMMIT: ${{ github.event.before }}
          HEAD_COMMIT: ${{ github.sha }}
        run: bun scripts/refresh-last-updated.ts "$BASE_COMMIT" "$HEAD_COMMIT"

      - name: Commit refreshed timestamps
        id: timestamps
        run: |
          if [ -z "$(git status --porcelain -- content/docs)" ]; then
            echo "content_commit=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name 'qtsurfer-content-bot[bot]'
          git config user.email 'qtsurfer-content-bot[bot]@users.noreply.github.com'
          git add content/docs
          git commit -m 'chore(content): refresh document timestamps'
          git push origin HEAD:main
          echo "content_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Request web content synchronization
        env:
          DISPATCH_TOKEN: ${{ secrets.QTSURFER_WEB_DISPATCH_TOKEN }}
          CONTENT_COMMIT: ${{ steps.timestamps.outputs.content_commit }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "Missing QTSURFER_WEB_DISPATCH_TOKEN repository secret." >&2
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $DISPATCH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            --url 'https://api.github.com/repos/mrmx/qts-web/dispatches' \
            --data "{\"event_type\":\"content-updated\",\"client_payload\":{\"source_repository\":\"QTSurfer/qtsurfer-content\",\"content_commit\":\"$CONTENT_COMMIT\"}}"
